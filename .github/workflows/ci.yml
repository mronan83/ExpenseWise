# Quality gates G1–G5 (docs/06-delivery-lifecycle.md). Every gate blocks merge.
# G6 (release gate on staging) arrives with the staging environment.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: '1'
  TURBO_TELEMETRY_DISABLED: '1'

jobs:
  static:
    name: G1 · Static checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck

  unit:
    name: G2 · Unit & property tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Tests (domain coverage floor 90%)
        run: pnpm test
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage
          path: packages/domain/coverage
          if-no-files-found: ignore

  integration:
    name: G3 · Integration & contract
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Tenancy, audit and outbox against real Postgres
        run: pnpm test:integration
      - name: OpenAPI contract and schema migrations in sync
        run: pnpm contract:check

  security:
    name: G4 · Security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: pnpm/action-setup@v6
      # No dependency cache here: this job never installs, and setup-node's post step
      # fails the job when the cache path it expects doesn't exist. setup-node also caches
      # automatically when package.json names a package manager, and whenever no cache yet
      # exists for the lockfile (the first run after it changes) this job tried to save one
      # and failed. That made G4 fail only sometimes, hence the explicit opt-out.
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Dependency audit (high and critical block)
        run: pnpm audit --audit-level high

  e2e:
    name: G5 · Build & end-to-end
    runs-on: ubuntu-latest
    needs: static
    # The signed-in checks run the real API on its own database (apps/web/e2e/bench).
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Built against a stand-in Supabase project that never answers, so the signed-in checks
      # can hold a session; the tests answer its requests themselves (e2e/bench/config.ts).
      - run: pnpm build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://e2e.supabase.invalid
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_e2e
      - name: Install browsers
        run: pnpm --filter @expensewise/web exec playwright install --with-deps chromium webkit
      - name: Journeys, layout and accessibility, signed out and in (desktop Chromium, iPhone WebKit)
        run: pnpm --filter @expensewise/web test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report
